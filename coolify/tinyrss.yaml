# documentation: https://github.com/idan/tinyrss
# slogan: A tiny single-user RSS reader with a Google Reader compatible API.
# category: RSS
# tags: rss,feed,reader,greader,google-reader,sqlite
# port: 8080
#
# Coolify service definition. To deploy: in Coolify create a new resource, choose
# "Docker Compose Empty", paste this file, set the domain, and deploy. See the README.
# The login password is generated by Coolify (SERVICE_PASSWORD_TINYRSS in Environment Variables).

services:
  tinyrss:
    image: ghcr.io/idan/tinyrss:0.1.0
    environment:
      - SERVICE_URL_TINYRSS_8080
      - TINYRSS_USERNAME=${TINYRSS_USERNAME:-admin}
      - TINYRSS_PASSWORD=${SERVICE_PASSWORD_TINYRSS}
      - TINYRSS_FETCH_INTERVAL=${TINYRSS_FETCH_INTERVAL:-30}
      - TINYRSS_RETENTION_DAYS=${TINYRSS_RETENTION_DAYS:-90}
      - TINYRSS_BACKUP_INTERVAL_HOURS=${TINYRSS_BACKUP_INTERVAL_HOURS:-24}
      - TINYRSS_BACKUP_KEEP=${TINYRSS_BACKUP_KEEP:-14}
      # Optional off-site backups to any S3-compatible storage (AWS S3, Cloudflare R2, B2, MinIO, …)
      - TINYRSS_BACKUP_S3_BUCKET=${TINYRSS_BACKUP_S3_BUCKET:-}
      - TINYRSS_BACKUP_S3_ENDPOINT=${TINYRSS_BACKUP_S3_ENDPOINT:-}
      - TINYRSS_BACKUP_S3_REGION=${TINYRSS_BACKUP_S3_REGION:-}
      - TINYRSS_BACKUP_S3_ACCESS_KEY_ID=${TINYRSS_BACKUP_S3_ACCESS_KEY_ID:-}
      - TINYRSS_BACKUP_S3_SECRET_ACCESS_KEY=${TINYRSS_BACKUP_S3_SECRET_ACCESS_KEY:-}
      - TINYRSS_BACKUP_S3_PREFIX=${TINYRSS_BACKUP_S3_PREFIX:-tinyrss/}
    volumes:
      - tinyrss-data:/data
    healthcheck:
      test: ["CMD", "tinyrss", "healthcheck"]
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 5

volumes:
  tinyrss-data:
