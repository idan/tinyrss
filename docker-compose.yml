# Works with Coolify's "Docker Compose" build pack as well as plain `docker compose up -d`.
# Coolify lists every ${VARIABLE} below in its Environment Variables UI.
services:
  tinyrss:
    build: .
    restart: unless-stopped
    environment:
      # Credentials are (re)applied on every start. Leave TINYRSS_PASSWORD empty to manage
      # them with `tinyrss set-password` inside the container instead.
      - TINYRSS_USERNAME=${TINYRSS_USERNAME:-admin}
      - TINYRSS_PASSWORD=${TINYRSS_PASSWORD:-}
      - TINYRSS_FETCH_INTERVAL=${TINYRSS_FETCH_INTERVAL:-30}
      - TINYRSS_RETENTION_DAYS=${TINYRSS_RETENTION_DAYS:-90}
      # Backups go to /data/backups (same volume). Set a bucket to also keep off-site copies in
      # any S3-compatible storage (AWS S3, Cloudflare R2, Backblaze B2, MinIO, …); the same
      # credentials as a Coolify "S3 Storage" work.
      - TINYRSS_BACKUP_INTERVAL_HOURS=${TINYRSS_BACKUP_INTERVAL_HOURS:-24}
      - TINYRSS_BACKUP_KEEP=${TINYRSS_BACKUP_KEEP:-14}
      - TINYRSS_BACKUP_S3_BUCKET=${TINYRSS_BACKUP_S3_BUCKET:-}
      - TINYRSS_BACKUP_S3_ENDPOINT=${TINYRSS_BACKUP_S3_ENDPOINT:-}
      - TINYRSS_BACKUP_S3_REGION=${TINYRSS_BACKUP_S3_REGION:-}
      - TINYRSS_BACKUP_S3_ACCESS_KEY_ID=${TINYRSS_BACKUP_S3_ACCESS_KEY_ID:-}
      - TINYRSS_BACKUP_S3_SECRET_ACCESS_KEY=${TINYRSS_BACKUP_S3_SECRET_ACCESS_KEY:-}
      - TINYRSS_BACKUP_S3_PREFIX=${TINYRSS_BACKUP_S3_PREFIX:-tinyrss/}
    volumes:
      - tinyrss-data:/data
    # Coolify routes traffic through its proxy, so no host port is needed there.
    # For plain Docker, uncomment to publish the port:
    # ports:
    #   - "8080:8080"
    expose:
      - "8080"

volumes:
  tinyrss-data:
